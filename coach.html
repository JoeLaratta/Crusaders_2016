<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crusaders — Player Profiles</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="robots" content="noindex, nofollow">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#FAF9F5; color:#121821; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:32px 20px; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:26px; letter-spacing:0.06em; text-transform:uppercase; color:#B3161C; margin-bottom:4px; }
  .sub { font-size:13px; color:#7A7266; margin-bottom:28px; }
  .card { background:#fff; border-top:3px solid #B3161C; padding:24px; box-shadow:0 1px 3px rgba(18,24,33,0.08); }
  label { display:block; font-size:13px; color:#3A3630; margin-bottom:6px; }
  input[type=password] { width:100%; max-width:320px; font-size:16px; padding:10px 12px; border:1px solid #DCD5C8; border-radius:4px; background:#FBF9F5; }
  button { font-size:14px; letter-spacing:0.1em; text-transform:uppercase; padding:11px 20px; border:0; border-radius:4px; background:#B3161C; color:#fff; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:default; }
  button.ghost { background:transparent; color:#3A3630; border:1px solid #C9C1B2; padding:7px 14px; font-size:12px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:16px; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th { text-align:left; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#7A7266; padding:10px 8px; border-bottom:2px solid #DCD5C8; }
  td { padding:12px 8px; border-bottom:1px solid #EDE9E1; font-size:15px; }
  .msg { margin-top:14px; font-size:14px; }
  .err { color:#B3161C; }
  .ok { color:#2E7D32; }
  .hide { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Player Profiles</h1>
  <div class="sub">2016 Crusaders — coaching staff only</div>

  <div class="card" id="gate">
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password">
    <div class="row"><button id="go">View profiles</button></div>
    <div class="msg err hide" id="gateMsg"></div>
  </div>

  <div class="card hide" id="panel">
    <div class="row" style="margin:0 0 12px; justify-content:space-between">
      <strong id="count"></strong>
      <button class="ghost" id="out">Sign out</button>
    </div>
    <table>
      <thead><tr><th>Player</th><th>Jersey</th><th>Submitted</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="msg hide" id="panelMsg"></div>
  </div>
</div>

<script>
var pw = null;

function $(id) { return document.getElementById(id); }

function show(el, text, cls) {
  el.className = "msg " + (cls || "");
  el.textContent = text;
}

async function post(path, payload) {
  var r = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  return r;
}

async function loadList() {
  var r = await post("/api/list", { password: pw });
  if (r.status === 401) { throw new Error("Incorrect password."); }
  if (!r.ok) { throw new Error("Could not load profiles."); }
  var out = await r.json();
  return out.rows || [];
}

function render(rows) {
  $("count").textContent = rows.length + (rows.length === 1 ? " profile" : " profiles");
  var tbody = $("rows");
  tbody.innerHTML = "";

  if (!rows.length) {
    var tr = document.createElement("tr");
    var td = document.createElement("td");
    td.colSpan = 4;
    td.style.color = "#7A7266";
    td.textContent = "No submissions yet.";
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }

  rows.forEach(function (row) {
    var tr = document.createElement("tr");

    var name = document.createElement("td");
    name.textContent = row.full_name;
    tr.appendChild(name);

    var jersey = document.createElement("td");
    jersey.textContent = row.jersey || "";
    tr.appendChild(jersey);

    var when = document.createElement("td");
    when.style.color = "#7A7266";
    when.style.fontSize = "13px";
    when.textContent = new Date(row.created_at).toLocaleDateString("en-CA");
    tr.appendChild(when);

    var actions = document.createElement("td");
    actions.style.textAlign = "right";
    var btn = document.createElement("button");
    btn.className = "ghost";
    btn.textContent = "Download PDF";
    btn.onclick = function () { download(row, btn); };
    actions.appendChild(btn);
    tr.appendChild(actions);

    tbody.appendChild(tr);
  });
}

async function download(row, btn) {
  var original = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Building...";
  try {
    var r = await post("/api/pdf", { password: pw, id: row.id });
    if (!r.ok) { throw new Error("Failed"); }
    var blob = await r.blob();
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = row.full_name.replace(/[^a-z0-9]+/gi, "_") + ".pdf";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) {
    show($("panelMsg"), "Could not build that PDF. Try again.", "err");
    $("panelMsg").classList.remove("hide");
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

$("go").onclick = async function () {
  var entered = $("pw").value;
  if (!entered) { return; }
  $("go").disabled = true;
  $("gateMsg").classList.add("hide");
  try {
    pw = entered;
    var rows = await loadList();
    $("pw").value = "";
    $("gate").classList.add("hide");
    $("panel").classList.remove("hide");
    render(rows);
  } catch (e) {
    pw = null;
    show($("gateMsg"), e.message, "err");
    $("gateMsg").classList.remove("hide");
  } finally {
    $("go").disabled = false;
  }
};

$("pw").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { $("go").click(); }
});

$("out").onclick = function () {
  pw = null;
  $("panel").classList.add("hide");
  $("gate").classList.remove("hide");
  $("rows").innerHTML = "";
};
</script>
</body>
</html>
