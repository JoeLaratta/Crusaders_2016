<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Card - Crusaders 2016</title>
<style>
  /* Team colours live here - change these two lines to restyle every card. */
  :root {
    --team-dark: #14213d;
    --team-accent: #c8102e;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --paper: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: #f3f4f6;
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .page-head {
    max-width: 760px;
    margin: 0 auto 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
  }
  .page-head h1 { font-size: 20px; margin: 0; }
  .page-head .actions { display: flex; gap: 8px; }

  button {
    font: inherit;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  button.primary {
    background: var(--team-dark);
    border-color: var(--team-dark);
    color: #fff;
  }
  button:hover { filter: brightness(1.08); }

  .state {
    max-width: 760px;
    margin: 40px auto;
    text-align: center;
    color: var(--muted);
  }
  .state.err { color: var(--team-accent); }

  /* ---------- the card ---------- */
  .card {
    max-width: 760px;
    margin: 0 auto 28px;
    background: var(--paper);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.06);
  }

  .card-top {
    background: var(--team-dark);
    color: #fff;
    padding: 22px 24px;
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .shot {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    object-fit: cover;
    background: #dbe1ea;
    border: 4px solid #fff;
    flex: 0 0 auto;
  }
  .shot-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 700;
    color: var(--team-dark);
    background: #dbe1ea;
  }

  .who { min-width: 0; }
  .who .season {
    font-size: 12px;
    letter-spacing: .09em;
    text-transform: uppercase;
    opacity: .75;
  }
  .who h2 {
    margin: 3px 0 6px;
    font-size: 27px;
    line-height: 1.15;
    word-break: break-word;
  }
  .who .num {
    display: inline-block;
    background: var(--team-accent);
    padding: 3px 11px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
  }

  .card-body { padding: 20px 24px 24px; }

  .sect-title {
    font-size: 11px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 20px 0 10px;
    padding-bottom: 5px;
    border-bottom: 2px solid var(--line);
  }
  .sect-title:first-child { margin-top: 0; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px 18px;
  }
  .grid .k {
    font-size: 11px;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .grid .v { font-weight: 600; word-break: break-word; }

  .qa { margin-bottom: 14px; }
  .qa .q { font-size: 13px; color: var(--muted); margin-bottom: 3px; }
  .qa .a {
    font-size: 16px;
    padding-left: 12px;
    border-left: 3px solid var(--team-accent);
    word-break: break-word;
  }

  .nodata {
    padding: 16px;
    border: 1px dashed var(--line);
    border-radius: 10px;
    color: var(--muted);
    text-align: center;
  }

  .card-foot {
    padding: 12px 24px 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* ---------- print / save as PDF ---------- */
  @page { size: letter portrait; margin: 0.45in; }

  @media print {
    body { background: #fff; padding: 0; }
    .page-head, .noprint { display: none !important; }
    .card {
      box-shadow: none;
      border: 1px solid var(--line);
      margin: 0;
      max-width: none;
      break-inside: avoid;
    }
    /* One card per sheet, but no trailing blank page. */
    .card + .card { break-before: page; }
    /* Chrome drops backgrounds by default; keep the team colours. */
    .card-top, .who .num, .shot-empty {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>
<body>

<div class="page-head noprint">
  <h1>Player Card</h1>
  <div class="actions">
    <button id="backBtn">Back to handbook</button>
    <button id="printBtn" class="primary">Print / Save as PDF</button>
  </div>
</div>

<div id="root"><p class="state">Loading...</p></div>

<script>
(function () {
  "use strict";

  var SEASON = "2016 Crusaders";

  // Question wording matches the labels on the handbook form so the card
  // reads back the way the parent filled it in.
  var VITALS = [
    ["position", "Favourite position"],
    ["birthday", "Birthday"],
    ["height", "Height"],
    ["weight", "Weight"],
    ["shoots", "Shoots"],
    ["catches", "Goalies - catches"]
  ];

  var FAVOURITES = [
    ["nhlTeam", "Favourite NHL team"],
    ["nhlPlayer", "Favourite NHL player"],
    ["food", "Favourite food"],
    ["subject", "Favourite subject in school"],
    ["otherSport", "Other sport (besides hockey)"],
    ["hypeSong", "Hype song before games"]
  ];

  var QUESTIONS = [
    ["loveMost", "What do you love most about hockey?"],
    ["teammate", "What does being a great teammate mean to you?"],
    ["improve", "What do you want to improve this season?"]
  ];

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function initials(name) {
    var parts = String(name || "").trim().split(/\s+/);
    var first = parts[0] ? parts[0].charAt(0) : "";
    var last = parts.length > 1 ? parts[parts.length - 1].charAt(0) : "";
    return (first + last).toUpperCase() || "?";
  }

  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
  }

  // Only render rows the parent actually filled in - blank fields would make
  // the keepsake look unfinished.
  function filled(data, pairs) {
    if (!data) return [];
    return pairs.filter(function (p) {
      var v = data[p[0]];
      return typeof v === "string" && v.trim() !== "";
    });
  }

  function gridHtml(data, pairs) {
    var rows = filled(data, pairs);
    if (!rows.length) return "";
    var html = '<div class="grid">';
    rows.forEach(function (p) {
      html += '<div><div class="k">' + esc(p[1]) + '</div>' +
              '<div class="v">' + esc(data[p[0]]) + "</div></div>";
    });
    return html + "</div>";
  }

  function qaHtml(data, pairs) {
    var rows = filled(data, pairs);
    if (!rows.length) return "";
    var html = "";
    rows.forEach(function (p) {
      html += '<div class="qa"><div class="q">' + esc(p[1]) + "</div>" +
              '<div class="a">' + esc(data[p[0]]) + "</div></div>";
    });
    return html;
  }

  function cardHtml(p) {
    var data = p.data || null;

    var shot = p.photo
      ? '<img class="shot" src="' + esc(p.photo) + '" alt="' + esc(p.name) + '">'
      : '<div class="shot shot-empty">' + esc(initials(p.name)) + "</div>";

    var html = '<article class="card">' +
      '<div class="card-top">' + shot +
        '<div class="who">' +
          '<div class="season">' + esc(SEASON) + "</div>" +
          "<h2>" + esc(p.name) + "</h2>" +
          (p.jersey ? '<span class="num">#' + esc(p.jersey) + "</span>" : "") +
        "</div>" +
      "</div>" +
      '<div class="card-body">';

    if (!data) {
      html += '<div class="nodata">This player profile form has not been filled in yet. ' +
              "Complete it in the handbook and the card will fill in automatically.</div>";
    } else {
      var vitals = gridHtml(data, VITALS);
      var favs = gridHtml(data, FAVOURITES);
      var qs = qaHtml(data, QUESTIONS);

      if (vitals) html += '<div class="sect-title">On the ice</div>' + vitals;
      if (favs) html += '<div class="sect-title">Favourites</div>' + favs;
      if (qs) html += '<div class="sect-title">In their own words</div>' + qs;

      if (!vitals && !favs && !qs) {
        html += '<div class="nodata">No profile details were filled in on the form yet.</div>';
      }
    }

    html += "</div>";

    var when = fmtDate(p.submittedAt);
    html += '<div class="card-foot"><span>' + esc(SEASON) + " season keepsake</span>" +
            (when ? "<span>Profile submitted " + esc(when) + "</span>" : "") +
            "</div></article>";

    return html;
  }

  function render(players) {
    var root = document.getElementById("root");
    if (!players || !players.length) {
      root.innerHTML = '<p class="state">No players are linked to this login yet. ' +
                       "Please contact Coach Steve.</p>";
      return;
    }
    // One card per player - a family with twins gets two.
    root.innerHTML = players.map(cardHtml).join("");
  }

  document.getElementById("printBtn").addEventListener("click", function () {
    window.print();
  });

  document.getElementById("backBtn").addEventListener("click", function () {
    window.location.href = "/handbook.html";
  });

  fetch("/api/me?cards=1", { credentials: "same-origin" })
    .then(function (r) {
      if (r.status === 401 || r.status === 403) {
        window.location.href = "/login.html";
        return Promise.reject(new Error("unauthorised"));
      }
      return r.json().then(function (d) {
        if (!r.ok) return Promise.reject(new Error(d.error || "Could not load player card"));
        return d;
      });
    })
    .then(function (d) { render(d.players); })
    .catch(function (e) {
      if (e && e.message === "unauthorised") return;
      document.getElementById("root").innerHTML =
        '<p class="state err">' + esc(e.message || "Could not load player card") + "</p>";
    });
})();
</script>

</body>
</html>
